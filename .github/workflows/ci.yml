name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zerobrand_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      ZEROBRAND_PG_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/zerobrand_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/server/go.mod
          cache-dependency-path: v2/server/go.sum
      - run: sudo apt-get update && sudo apt-get install -y webp zstd
      - run: bash scripts/build.sh
      - run: cd v2/web && npx playwright install --with-deps chromium
      - run: bash scripts/test.sh
